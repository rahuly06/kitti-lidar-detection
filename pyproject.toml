[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitti-lidar-detector"
version = "0.1.0"
description = "Educational BEV object-detection baseline for KITTI LiDAR data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0", "matplotlib>=3.7"]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
